{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>논문/기사 요약 서비스</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            const fileTextInput = document.getElementById('file-text');

            // 파일 선택 후 텍스트 박스에 파일명 표시
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    fileTextInput.value = fileInput.files[0].name;
                } else {
                    fileTextInput.value = '';
                }
            });
        });
    </script>
    <style>
        .input-icons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            width: 60%;
        }

        .icon-btn {
            cursor: pointer;
            font-size: 30px;
        }

        #url-input, #file-text {
            width: 100%;
            padding: 5px;
            text-align: center;
        }

        #file-input {
            display: none; /* 파일 선택창 숨기기 */
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>논문/기사 요약 서비스</h1>
        </header>

        <main>
            <section class="input-section">
                <textarea id="article-text" placeholder="기사/논문 텍스트를 입력하세요..."></textarea>

                <div class="input-icons">
                    <!-- URL 입력 -->
                    <div style="width:60%; display:flex; align-items:center; justify-content:center; gap:5px;">
                        <label for="url-input" class="icon-btn">🌐</label>
                        <input type="text" id="url-input" placeholder="URL 입력">
                    </div>

                    <!-- 파일 업로드 -->
                    <div class="file-upload-wrapper">
                        <label for="file-input" class="icon-btn">📂</label>
                        <input type="file" id="file-input">
                        <input type="text" id="file-text" placeholder="파일을 선택하세요" readonly>
                    </div>
                </div>

                <button id="summarize-btn">요약하기</button>
            </section>

            <hr>

            <section class="output-section">
                <h2>요약 결과</h2>
                <div id="summary-box">
                    요약 결과가 여기에 표시됩니다.
                </div>
            </section>
        </main>
    </div>
</body>
</html>
